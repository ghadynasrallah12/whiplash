<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Whiplash</title>
  <meta name="description" content="Whiplash — post-production studio.">
  <link rel="stylesheet" href="css/site.css">
</head>
<body data-scene="home">
  <div class="stage">
    <!-- The frame: the reel plays here; scenes 02–06 cut in over it -->
    <div class="frame">
      <video class="reel" autoplay muted loop playsinline preload="auto" poster="assets/hero-poster.jpg">
        <source src="assets/hero.mp4" type="video/mp4">
      </video>

      <section class="scene" data-scene="clients"  aria-labelledby="nav-clients"  hidden><h2 class="scene__title">Clients</h2></section>
      <section class="scene" data-scene="projects" aria-labelledby="nav-projects" hidden><h2 class="scene__title">Projects</h2></section>
      <section class="scene" data-scene="team"     aria-labelledby="nav-team"     hidden><h2 class="scene__title">Team</h2></section>
      <section class="scene" data-scene="contact"  aria-labelledby="nav-contact"  hidden><h2 class="scene__title">Contact</h2></section>

      <div class="cut" aria-hidden="true"></div>
    </div>

    <!-- crop marks, one outside each corner of the frame -->
    <i class="crop crop--tl" aria-hidden="true"></i><i class="crop crop--tr" aria-hidden="true"></i>
    <i class="crop crop--bl" aria-hidden="true"></i><i class="crop crop--br" aria-hidden="true"></i>

    <nav class="nav" aria-label="Main">
      <div class="nav__group">
        <a id="nav-home"    href="#home"    data-go="home"><span>[01]</span> Home</a>
        <a id="nav-about"   href="#about"   data-go="about"><span>[02]</span> About</a>
        <a id="nav-clients" href="#clients" data-go="clients"><span>[03]</span> Clients</a>
      </div>
      <div class="nav__group nav__group--r">
        <a id="nav-projects" href="#projects" data-go="projects"><span>[04]</span> Projects</a>
        <a id="nav-team"     href="#team"     data-go="team"><span>[05]</span> Team</a>
        <a id="nav-contact"  href="#contact"  data-go="contact"><span>[06]</span> Contact</a>
      </div>
    </nav>

    <button class="side side--l" id="sound" type="button" aria-pressed="false" aria-label="Sound">Sound — <b data-on>On</b> / <b data-off>Off</b></button>
    <button class="side side--r" id="next" type="button" aria-label="Next scene">Scroll to cut →</button>

    <p class="foot foot--l" data-text="home.tagline">Post-production · Beirut / Dubai / KSA</p>
    <p class="foot foot--r"><span data-text="home.reel_label">Showreel 26</span> <span class="rec"><i></i>Rec <span id="tc">00:00:00:00</span></span></p>
  </div>

  <!-- [02] About: a red page the logo floods open. Chapters come from the dashboard (About). -->
  <section class="about" id="about" aria-labelledby="nav-about" hidden>
    <p class="about__sub"><span>[02] About — </span><span id="ch-count">5</span> chapters</p>
    <div class="chapters" id="chapters" role="tablist" aria-label="Chapters"></div>
    <figure class="plate">
      <div class="plate__img"><img id="ch-img" src="" alt=""></div>
      <i class="plate__sq plate__sq--1"></i><i class="plate__sq plate__sq--2"></i><i class="plate__sq plate__sq--3"></i>
      <figcaption id="ch-cap"></figcaption>
    </figure>
    <p class="about__text" id="ch-text"></p>
    <a class="about__back" href="#home" data-go="home">← [01] Home</a>
    <span class="about__hint">Pick a chapter</span>
  </section>

  <!-- 3D logo (turns left/right only) -->
  <canvas id="logo" class="logo" aria-label="Whiplash logo"></canvas>
  <div class="ring" aria-hidden="true"></div>

  <script src="admin/config.js"></script>
  <script src="js/logo3d.js" defer></script>
  <script src="js/site.js" defer></script>
</body>
</html>
